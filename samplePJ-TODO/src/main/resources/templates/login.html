<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" th:href="@{/css/destyle.css}">
        <link rel="stylesheet" th:href="@{/css/login.css}">
        <title>ログイン</title>
    </head>
    <body>
        <div class="container">
            <div class="wrapper">
                <h1 class="title">ログイン</h1>
                <form th:action="@{/login}" method="post" th:object="${login}">
                    <p>ユーザー名</p>
                    <input type="text" id="username" name="username" th:field="*{username}">
                    <p th:if="${#fields.hasErrors('username')}" th:errors="*{username}" class="error-message"></p>
                    
                    
                    <p class="pass">パスワード</p>
                    <input type="password" id="password" name="password" th:field="*{password}">
                    <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="error-message"></p>
                    
                    
                    <input type="submit" value="ログイン" class="login Btn">
                    <p class="center-or">または</p>
                    <input type="submit" class="apiLogin Btn" value="APIでログイン">
                </form>
            </div>
        </div>
    </body>
</html>
