<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>ユーザー登録</title>
<link rel="stylesheet" th:href="@{/css/destyle.css}">
<link rel="stylesheet" th:href="@{/css/register.css}">
</head>
<body>
    <div class="container">
        <div class="wrapper">
            <h1>ユーザー登録</h1>
            <form th:action="@{/register}" method="post" th:object="${user}">
            <div class="inputSpace">
                <p>ユーザー名(半角英字)</p>
                <input type="text" id="username" name="username" th:field="*{username}">
                <p th:if="${#fields.hasErrors('username')}" th:errors = "*{username}" class="error-message"></p>
                
                
                <p>パスワード(半角英数字)</p>
                <input type="password" id="password" name="password" th:field="*{password}">
                <p th:if="${#fields.hasErrors('password')}" th:errors = "*{password}" class="error-message"></p>
            </div>
                <input type="submit" value="登録" class="register-btn">
            </form>
                <a th:href="@{/login}" class="login-btn">ログインはこちら</a>
        </div>
    </div>


</body>
</html>
