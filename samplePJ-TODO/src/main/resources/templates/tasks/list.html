<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<html>

<head>
	<meta charset="UTF-8">
	<title>タスク一覧></title>
	<link rel="stylesheet" th:href="@{/css/destyle.css}">
	<link rel="stylesheet" th:href="@{/css/list.css}">
</head>

<body>
	<div class="container">
		<div class="wrapper">
			<h1>タスク一覧</h1>

			<div class="message" th:if="${#lists.isEmpty(tasks)}">
				<P>現在タスクは登録されていません。「新規作成」から追加してください。</P>
			</div>

			<table th:if="${not #lists.isEmpty(tasks)}" border="1">
				<thead>
					<tr>
						<th>ID</th>
						<th>タイトル</th>
						<th>内容</th>
						<th>登録者</th>
						<th>開始日</th>
						<th>終了日</th>
						<th>作成日時</th>
						<th>更新日時</th>
						<th>操作</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="task : ${tasks}">
						<td th:text="${task.id}"></td>
						<td th:text="${task.title}"></td>
						<td th:text="${task.content}"></td>
						<td th:text="${task.name}"></td>
						<td th:text="${task.startDate}"></td>
						<td th:text="${task.endDate}"></td>
						<td th:text="${task.createdAt}"></td>
						<td th:text="${task.updatedAt}"></td>
						<td>
							<a class="edit" th:href="@{/edit/{id}(id=${task.id})}">編集</a>
							<form th:action="@{/tasks/delete/{id}(id=${task.id})}"
          method="post"
          style="display:inline"
          onsubmit="return confirm('削除しますか？');">
        <button type="submit" class="delete">削除</button>
    </form>
						</td>
					</tr>
				</tbody>
			</table>

			<div class="btn" th:if="${totalPages > 1}">

    <!-- 前へ -->
    <a th:if="${currentPage > 1}"
       th:href="@{/tasks(page=${currentPage - 1})}">
       &lt;&lt; 前
    </a>

    <!-- ページ番号 -->
    <div class="line">
        <a th:each="i : ${#numbers.sequence(1, totalPages)}"
           th:href="@{/tasks(page=${i})}"
           th:text="${i}"
           th:classappend="${i == currentPage} ? 'active'">
        </a>
    </div>

    <!-- 次へ -->
    <a th:if="${currentPage < totalPages}"
       th:href="@{/tasks(page=${currentPage + 1})}">
       次 &gt;&gt;
    </a>
</div>

			<!--<a class="new" th:href="@{/new}">＋新規作成</a>-->

			</wrapper>
			
			<div class="footer">
    <a class="new" th:href="@{/new}">＋新規作成</a>
</div>
		</div>
</body>

</html>
